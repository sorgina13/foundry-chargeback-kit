# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.4'
name: chargeback-agent
services:
    chargeback-agent:
        project: .
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        codeConfiguration:
            # main.py must remain the entry point; it registers the chargeback span processor.
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: An in-process multi-agent orchestrator instrumented for per-request chargeback telemetry.
        displayName: ChargebackAgent
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            # Keeps trace IDs, model identity, latency and token usage while excluding prompt content.
            - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
              value: "false"
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
        name: ChargebackAgent
        protocols:
            - protocol: responses
              version: 2.0.0
    ai-project:
        host: azure.ai.project
        deployments: []
        # Replace with your own Foundry project endpoint before running `azd up`.
        endpoint: https://<your-account>.services.ai.azure.com/api/projects/<your-project>
infra:
    provider: microsoft.foundry
